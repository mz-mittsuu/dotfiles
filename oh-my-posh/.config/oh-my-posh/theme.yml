# ==================================================
# @file ~/.config/oh-my-posh/theme.yml
# @brief Oh My Posh prompt theme
# ==================================================


# --------------------------------------------------
# Schema
# --------------------------------------------------

$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 4


# --------------------------------------------------
# Palette
# --------------------------------------------------

palette:
  black: "black"
  red: "red"
  green: "green"
  yellow: "yellow"
  blue: "blue"
  magenta: "magenta"
  cyan: "cyan"
  white: "white"

  darkGray: "darkGray"
  lightRed: "lightRed"
  lightGreen: "lightGreen"
  lightYellow: "lightYellow"
  lightBlue: "lightBlue"
  lightMagenta: "lightMagenta"
  lightCyan: "lightCyan"
  lightWhite: "lightWhite"


# --------------------------------------------------
# Prompt Blocks
# --------------------------------------------------

blocks:

  # Status Code
  - type: prompt
    newline: true
    alignment: left
    force: true
    segments:
      - type: status
        style: plain
        foreground: p:lightRed
        template: "  ✘  {{ reason .Code }}"

  # Execution Time
  - type: prompt
    alignment: right
    segments:
      - type: executiontime
        style: plain
        foreground: p:darkGray
        template: "   {{ .FormattedMs }} "

  - type: prompt
    newline: true
    alignment: left
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "╭"

  - type: prompt
    alignment: right
    filler: "<p:darkGray>─</>"
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "╮"

  - type: prompt
    newline: true
    alignment: left
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "│ "

      # OS
      - type: os
        style: plain
        foreground: p:lightGreen
        template: "{{ .Icon }}  "

      # Session
      - type: session
        style: plain
        foreground: p:lightGreen
        template: '{{ .UserName }}@{{ (split "." .HostName)._0 }}'

  - type: prompt
    alignment: right
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "│"

  - type: prompt
    newline: true
    alignment: left
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "│ "

      # Path
      - type: path
        style: plain
        foreground: p:lightBlue
        template: "  {{ .Path }}"
        options:
          style: full

  - type: prompt
    alignment: right
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "│"

  - type: prompt
    newline: true
    alignment: left
    segments:
      - type: git
        style: plain
        foreground: p:darkGray
        template: "│ "

      # Git
      - type: git
        style: plain
        foreground: p:lightYellow
        template: "{{ if .Upstream }}{{ .UpstreamIcon }}  {{ else }}󰊢  {{ end }}{{ .HEAD }}{{ if .Upstream }}...{{ .Upstream }} {{ end }}{{ if .Upstream }}[{{ if .UpstreamGone }}gone{{ else if or (gt .Ahead 0) (gt .Behind 0) }}{{ if gt .Ahead 0 }}ahead {{ .Ahead }}{{ end }}{{ if and (gt .Ahead 0) (gt .Behind 0) }}, {{ end }}{{ if gt .Behind 0 }}behind {{ .Behind }}{{ end }}{{ else }}up to date{{ end }}]{{ end }}{{ if .Working.Changed }}  {{ if gt .Working.Modified 0 }} M{{ .Working.Modified }}{{ end }}{{ if gt .Working.Added 0 }} A{{ .Working.Added }}{{ end }}{{ if gt .Working.Deleted 0 }} D{{ .Working.Deleted }}{{ end }}{{ if gt .Working.Untracked 0 }} ?{{ .Working.Untracked }}{{ end }}{{ if gt .Working.Unmerged 0 }} U{{ .Working.Unmerged }}{{ end }}{{ end }}{{ if .Staging.Changed }}  {{ if gt .Staging.Modified 0 }} M{{ .Staging.Modified }}{{ end }}{{ if gt .Staging.Added 0 }} A{{ .Staging.Added }}{{ end }}{{ if gt .Staging.Deleted 0 }} D{{ .Staging.Deleted }}{{ end }}{{ if gt .Staging.Untracked 0 }} ?{{ .Staging.Untracked }}{{ end }}{{ if gt .Staging.Unmerged 0 }} U{{ .Staging.Unmerged }}{{ end }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}"
        options:
          fetch_status: true
          fetch_upstream_icon: true
          branch_icon: ""

  - type: prompt
    alignment: right
    segments:
      - type: git
        style: plain
        foreground: p:darkGray
        template: "│"

  - type: prompt
    newline: true
    alignment: left
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "╰"

  - type: prompt
    alignment: right
    filler: "<p:darkGray>─</>"
    segments:
      - type: text
        style: plain
        foreground: p:darkGray
        template: "╯"

  - type: prompt
    newline: true
    alignment: left
    segments:

      # Python
      - type: python
        style: plain
        foreground: p:lightCyan
        template: "{{ if .Venv }}({{ .Venv }}) {{ end }}"

      # Prompt Symbol
      - type: text
        style: plain
        foreground: p:blue
        template: "› "


# --------------------------------------------------
# Transient Prompt
# --------------------------------------------------

transient_prompt:
  newline: true
  foreground: p:blue
  template: "› "


# --------------------------------------------------
# Secondary Prompt
# --------------------------------------------------

secondary_prompt:
  foreground: p:blue
  template: "│ "
