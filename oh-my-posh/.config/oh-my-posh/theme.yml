# ==================================================
# @file ~/.config/oh-my-posh/theme.yml
# @brief Oh My Posh prompt theme
# ==================================================


# --------------------------------------------------
# Schema
# --------------------------------------------------

$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 4


# --------------------------------------------------
# Palette
# --------------------------------------------------

palette:
  black: 'black'
  red: 'red'
  green: 'green'
  yellow: 'yellow'
  blue: 'blue'
  magenta: 'magenta'
  cyan: 'cyan'
  white: 'white'

  darkGray: 'darkGray'
  lightRed: 'lightRed'
  lightGreen: 'lightGreen'
  lightYellow: 'lightYellow'
  lightBlue: 'lightBlue'
  lightMagenta: 'lightMagenta'
  lightCyan: 'lightCyan'
  lightWhite: 'lightWhite'


# --------------------------------------------------
# Prompt Blocks
# --------------------------------------------------

blocks:

  # Status Code
  - type: prompt
    newline: true
    alignment: right
    force: true
    segments:

      # Execution Time
      - type: executiontime
        style: plain
        foreground: p:darkGray
        template: '{{ if .Executed }}<b>{{ .FormattedMs }}</b>{{ end }} '
        options:
          always_enabled: true

      # Status Code
      - type: status
        style: plain
        foreground: p:lightGreen
        foreground_templates:
          - '{{ if .Error }}p:lightRed{{ end }}'
        template: '{{ if .Executed }}<b>{{ if .Error }}✘ {{ else }}✔ {{ end }}{{ .Code }}</b>{{ end }}'
        options:
          always_enabled: true

  - type: prompt
    newline: true
    alignment: left
    segments:

      # OS
      - type: os
        style: plain
        foreground: p:lightGreen
        template: '<b>{{ .Icon }}</b> '

      # Session
      - type: session
        style: plain
        foreground: p:lightGreen
        template: '<b>{{ .UserName }}@{{ (split "." .HostName)._0 }}</b> '

      # Path
      - type: path
        style: plain
        foreground: p:lightBlue
        template: '<b> {{ .Path }}</b> '
        options:
          style: full

      # Git
      - type: git
        style: plain
        foreground: p:lightYellow
        template: '<b>󰊢 {{ .HEAD }}</b> '
        options:
          branch_icon: ''

      # Python
      - type: python
        style: plain
        foreground: p:lightCyan
        template: '<b>{{ if .Venv }} {{ .Venv }}{{ end }}</b>'

  - type: prompt
    newline: true
    alignment: left
    segments:

      # Prompt Symbol
      - type: text
        style: plain
        foreground: p:blue
        template: '% '


# --------------------------------------------------
# Transient Prompt
# --------------------------------------------------

transient_prompt:
  newline: true
  foreground: p:blue
  template: '% '


# --------------------------------------------------
# Secondary Prompt
# --------------------------------------------------

secondary_prompt:
  foreground: p:blue
  template: '│ '
