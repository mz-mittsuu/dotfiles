# ==================================================
# @file ~/.config/tmux/tmux.conf
# @brief Interactive tmux configuration
# ==================================================


# --------------------------------------------------
# Terminal
# --------------------------------------------------

set -g default-terminal "tmux-256color"
set -s terminal-features[100] "xterm*:RGB"
set -g focus-events on


# --------------------------------------------------
# Session
# --------------------------------------------------

set -g history-limit 100000
set -sg escape-time 10
set -g mouse on


# --------------------------------------------------
# Windows and Panes
# --------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"
bind Tab last-window

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# --------------------------------------------------
# Copy Mode
# --------------------------------------------------

setw -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# --------------------------------------------------
# Pane Navigation and Resizing
# --------------------------------------------------

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# --------------------------------------------------
# Appearance
# --------------------------------------------------

set -g status-right "C-b ? help"
set -g window-status-current-format \
    "[#I:#W#{?window_zoomed_flag,Z,}]"
set -g display-time 2000
set -g display-panes-time 2000

set -g status-style "fg=default,bg=default"
set -g status-left-style "fg=#6BC46D"
set -g status-right-style "fg=#909DAB"
set -g window-status-style "fg=#909DAB"
set -g window-status-current-style "fg=#6CB6FF,bold"

set -g pane-border-style "fg=#545D68"
set -g pane-active-border-style \
    "#{?synchronize-panes,fg=##FF938A,#{?pane_in_mode,fg=##DAAA3F,fg=##6CB6FF}}"

set -g mode-style "bg=#539BF5,fg=#22272E"
set -g message-style "bg=#539BF5,fg=#22272E"


# --------------------------------------------------
# Configuration
# --------------------------------------------------

bind R source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; \
    display-message "tmux config reloaded"
