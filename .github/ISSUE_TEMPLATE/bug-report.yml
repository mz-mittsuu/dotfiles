# ==================================================
# @file .github/ISSUE_TEMPLATE/bug-report.yml
# @brief GitHub Issue Form for bug reports
# ==================================================


# --------------------------------------------------
# Issue Form Configuration
# --------------------------------------------------

name: Bug Report
description: 設定や環境構築に関する不具合を報告します。
title: "[Bug]: "
labels:
  - bug


# --------------------------------------------------
# Issue Form Fields
# --------------------------------------------------

body:
  - type: markdown
    attributes:
      value: |
        不具合の報告ありがとうございます。
        credential、token、private keyなどの秘密情報は記載しないでください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生している問題を簡潔に記載してください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題を再現するための手順を記載してください。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
      description: 本来どのような結果になることを期待していたか記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: 実際に発生した結果を記載してください。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 利用環境
      description: OS、shell、関連するtoolのversionなど、問題の再現に必要な環境情報を記載してください。
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: log、screenshotなど、問題の調査に役立つ情報があれば記載してください。秘密情報は除去してください。
